<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Roleta de Números</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at center, #1f1c2c, #928dab);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
    }

    .logo {
      margin-top: 30px;
    }

    .logo img {
      width: 160px;
    }

    .controls {
      background: rgba(0,0,0,0.2);
      padding: 20px 30px;
      border-radius: 12px;
      margin-top: 20px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    input {
      padding: 10px;
      border: none;
      border-radius: 6px;
      margin: 0 5px;
      width: 80px;
      font-size: 16px;
      text-align: center;
    }

    button {
      margin-top: 10px;
      padding: 10px 25px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background-color: #00c9a7;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #00a88a;
    }

    .wheel-container {
      position: relative;
      width: 400px;
      height: 400px;
      margin-top: 30px;
    }

    .pointer {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 30px solid #fff;
      z-index: 2;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #fff;
      position: relative;
      overflow: hidden;
      transition: transform 5s ease-out;
      background: conic-gradient(#00c9a7, #845ec2, #00c9a7, #845ec2);
    }

    .wheel span {
      display: none; /* números ocultos */
    }

    #winner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ffffffdd;
      color: #1f1c2c;
      font-size: 50px;
      font-weight: bold;
      padding: 20px 40px;
      border-radius: 20px;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="logo">
    <img src="imagem/img.png" alt="Cartório">
  </div>

  <div class="controls">
    <h2>🎯 Roleta de Números</h2>
    <input type="number" id="min" placeholder="Mínimo">
    <input type="number" id="max" placeholder="Máximo">
    <br>
    <button onclick="spin()">Girar Roleta</button>
  </div>

  <div class="wheel-container">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
  </div>

  <div id="winner"></div>

  <script>
    const wheel = document.getElementById('wheel');
    const winnerDisplay = document.getElementById('winner');

    function buildWheel(min, max) {
      wheel.innerHTML = '';
      const total = max - min + 1;
      const anglePer = 360 / total;

      for (let i = 0; i < total; i++) {
        const angle = i * anglePer;
        const sector = document.createElement('span');
        sector.style.transform = `rotate(${angle}deg) translate(0, -100%)`;
        sector.style.background = i % 2 === 0 ? '#00c9a7' : '#845ec2';
        wheel.appendChild(sector);
      }
    }

    function spin() {
      const min = parseInt(document.getElementById('min').value);
      const max = parseInt(document.getElementById('max').value);

      if (isNaN(min) || isNaN(max) || min >= max) {
        alert('Intervalo inválido.');
        return;
      }

      buildWheel(min, max);

      const total = max - min + 1;
      const chosen = Math.floor(Math.random() * total);
      const number = min + chosen;
      const anglePer = 360 / total;
      const stopAngle = 360 * 5 + (360 - chosen * anglePer) - anglePer / 2;

      wheel.style.transition = 'transform 5s ease-out';
      wheel.style.transform = `rotate(${stopAngle}deg)`;

      winnerDisplay.style.display = 'none';

      setTimeout(() => {
        winnerDisplay.innerText = `🎉 ${number}`;
        winnerDisplay.style.display = 'block';
      }, 5000);
    }
  </script>
</body>
</html>
