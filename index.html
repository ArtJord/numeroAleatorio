<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Roleta de Númerros</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #fdf0d5, #ffeccc);
      color: #6b4226;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    .logo {
      margin-top: 30px;
    }

    .logo img {
      width: 160px;
    }

    .controls {
      background: #ffffffdd;
      padding: 20px 30px;
      border-radius: 12px;
      margin-top: 20px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    input {
      padding: 10px;
      border: 2px solid #ff8c42;
      border-radius: 6px;
      margin: 0 5px;
      width: 80px;
      font-size: 16px;
      text-align: center;
      background-color: #fff;
      color: #6b4226;
    }

    button {
      margin-top: 10px;
      padding: 10px 25px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background-color: #e63946;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #cc2b39;
    }

    .wheel-container {
      width: 400px;
      height: 400px;
      margin-top: 30px;
      position: relative;
      flex-shrink: 0;
    }

    .pointer {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 30px solid #6b4226;
      z-index: 2;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #f4d35e;
      position: relative;
      overflow: hidden;
      transition: transform 5s ease-out;
      background: conic-gradient(
        #ff8c42,
        #f4d35e,
        #e63946,
        #f4d35e,
        #ff8c42
      );
    }

    .wheel span {
      display: none;
    }

    #winner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ffffffec;
      color: #6b4226;
      font-size: 50px;
      font-weight: bold;
      padding: 20px 40px;
      border-radius: 20px;
      display: none;
      z-index: 10;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="logo">
    <img src="imagem/img.png" alt="Cartório">
  </div>

  <div class="controls">
    <h2>🎯 Roleta de Números</h2>
    <input type="number" id="min" placeholder="Mínimo">
    <input type="number" id="max" placeholder="Máximo"><br>
    <button onclick="spin()">🎲 Girar Roleta</button>
    <button onclick="gravarTela()">🎥 Gravar Tela</button>
  </div>

  <div class="wheel-container">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
  </div>

  <div id="winner"></div>

  <script>
    const wheel = document.getElementById('wheel');
    const winnerDisplay = document.getElementById('winner');

    function buildWheel(min, max) {
      wheel.innerHTML = '';
      const total = max - min + 1;
      const anglePer = 360 / total;

      for (let i = 0; i < total; i++) {
        const angle = i * anglePer;
        const sector = document.createElement('span');
        sector.style.transform = `rotate(${angle}deg) translate(0, -100%)`;
        sector.style.background = i % 2 === 0 ? '#f4d35e' : '#ff8c42';
        wheel.appendChild(sector);
      }
    }

    function spin() {
      const min = parseInt(document.getElementById('min').value);
      const max = parseInt(document.getElementById('max').value);

      if (isNaN(min) || isNaN(max) || min >= max) {
        alert('Intervalo inválido.');
        return;
      }

      buildWheel(min, max);

      const total = max - min + 1;
      const chosen = Math.floor(Math.random() * total);
      const number = min + chosen;
      const anglePer = 360 / total;
      const stopAngle = 360 * 5 + (360 - chosen * anglePer) - anglePer / 2;

      wheel.style.transition = 'transform 5s ease-out';
      wheel.style.transform = `rotate(${stopAngle}deg)`;

      winnerDisplay.style.display = 'none';

      setTimeout(() => {
        winnerDisplay.innerText = `🎉 ${number}`;
        winnerDisplay.style.display = 'block';
      }, 5000);
    }

    let recorder;
    let chunks = [];

    async function gravarTela() {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        recorder = new MediaRecorder(stream);
        chunks = [];

        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'roleta-gravada.webm';
          a.click();
        };

        recorder.start();
        alert('🔴 Gravação iniciada. Para encerrar, clique em "Parar Compartilhamento" no topo da tela.');
      } catch (err) {
        alert('Erro ao iniciar gravação: ' + err.message);
      }
    }
  </script>
</body>
</html>
